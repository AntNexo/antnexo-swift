name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The plain-Foundation core on Linux: cheap, every push and PR.
  core:
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift test --filter AntNexoCoreTests

  # The Apple layer and the sample on macOS (minutes cost 10x): release tags and by hand only.
  apple:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
      - name: Sample app (iOS simulator and macOS)
        run: |
          xcodebuild -project Examples/Sample/Sample.xcodeproj -scheme Sample-iOS -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
          xcodebuild -project Examples/Sample/Sample.xcodeproj -scheme Sample-macOS CODE_SIGNING_ALLOWED=NO -quiet build
